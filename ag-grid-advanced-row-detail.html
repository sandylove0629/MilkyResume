<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG Grid 進階 Row Detail 實現</title>
    
    <!-- AG Grid CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.2/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.2/styles/ag-theme-alpine.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .grid-container {
            height: 700px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .detail-panel {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .detail-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #007bff;
        }
        
        .detail-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #6610f2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-right: 20px;
        }
        
        .detail-title {
            flex: 1;
        }
        
        .detail-name {
            font-size: 1.8em;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        
        .detail-position {
            color: #6c757d;
            font-size: 1.1em;
            margin: 5px 0 0 0;
        }
        
        .detail-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .detail-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .detail-card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .detail-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: white;
            font-size: 16px;
        }
        
        .contact-icon { background: linear-gradient(135deg, #28a745, #20c997); }
        .work-icon { background: linear-gradient(135deg, #007bff, #6610f2); }
        .skills-icon { background: linear-gradient(135deg, #fd7e14, #e83e8c); }
        .projects-icon { background: linear-gradient(135deg, #6f42c1, #d63384); }
        
        .detail-card-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        .detail-info {
            color: #6c757d;
            line-height: 1.6;
        }
        
        .skill-tag {
            display: inline-block;
            background: linear-gradient(135deg, #007bff, #6610f2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin: 2px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .project-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #007bff;
        }
        
        .project-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .project-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .status-progress { background: #fff3cd; color: #856404; }
        .status-completed { background: #d1edff; color: #0c5460; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #6610f2);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .expand-btn {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .expand-btn:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .collapse-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .collapse-btn:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInModal 0.3s ease;
        }
        
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideInModal 0.3s ease;
        }
        
        @keyframes slideInModal {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .close-btn {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: all 0.2s ease;
        }
        
        .close-btn:hover {
            background: linear-gradient(135deg, #495057, #343a40);
            transform: translateY(-1px);
        }
        
        .method-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }
        
        .tab-btn {
            background: transparent;
            color: #6c757d;
            border: none;
            padding: 12px 24px;
            margin: 0 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 200px;
        }
        
        .tab-btn:hover {
            background: #e9ecef;
            color: #495057;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #007bff, #6610f2);
            color: white;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-table"></i> AG Grid 進階 Row Detail</h1>
        
        <div class="method-tabs">
            <button class="tab-btn active" onclick="showMethod(1)">
                <i class="fas fa-expand-arrows-alt"></i> 展開行
            </button>
            <button class="tab-btn" onclick="showMethod(2)">
                <i class="fas fa-list-alt"></i> 快速檢視
            </button>
            <button class="tab-btn" onclick="showMethod(3)">
                <i class="fas fa-window-maximize"></i> 彈出視窗
            </button>
        </div>
        
        <div id="grid1" class="grid-container ag-theme-alpine"></div>
        <div id="grid2" class="grid-container ag-theme-alpine" style="display: none;"></div>
        <div id="grid3" class="grid-container ag-theme-alpine" style="display: none;"></div>
    </div>

    <!-- AG Grid JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.2/dist/ag-grid-community.min.js"></script>
    
    <script>
        // 員工數據
        const employeeData = [
            {
                id: 1,
                name: '張小明',
                department: '資訊部',
                position: '資深軟體工程師',
                salary: 80000,
                email: 'ming.zhang@company.com',
                phone: '0912-345-678',
                address: '台北市信義區信義路五段7號',
                joinDate: '2020-03-15',
                skills: ['JavaScript', 'React', 'Node.js', 'Python', 'AWS', 'Docker'],
                projects: [
                    { name: '電商平台重構', status: '進行中', progress: 85, deadline: '2024-03-30' },
                    { name: 'API 微服務架構', status: '已完成', progress: 100, deadline: '2023-12-15' },
                    { name: '資料分析系統', status: '進行中', progress: 60, deadline: '2024-05-20' }
                ]
            },
            {
                id: 2,
                name: '李小華',
                department: '行銷部',
                position: '數位行銷經理',
                salary: 65000,
                email: 'hua.li@company.com',
                phone: '0923-456-789',
                address: '台北市大安區敦化南路二段216號',
                joinDate: '2019-07-10',
                skills: ['Google Analytics', 'Facebook Ads', 'SEO', 'Content Marketing', 'Adobe Creative Suite'],
                projects: [
                    { name: 'Q1品牌推廣活動', status: '進行中', progress: 70, deadline: '2024-03-31' },
                    { name: '社群媒體策略', status: '進行中', progress: 90, deadline: '2024-02-28' },
                    { name: '年度行銷計畫', status: '已完成', progress: 100, deadline: '2023-12-31' }
                ]
            },
            {
                id: 3,
                name: '王大強',
                department: '業務部',
                position: '業務總監',
                salary: 95000,
                email: 'wang.da@company.com',
                phone: '0934-567-890',
                address: '新北市板橋區文化路二段182號',
                joinDate: '2018-01-20',
                skills: ['Sales Strategy', 'CRM', 'Negotiation', 'Team Leadership', 'Market Analysis'],
                projects: [
                    { name: '大型客戶開發', status: '進行中', progress: 95, deadline: '2024-02-15' },
                    { name: '銷售流程優化', status: '已完成', progress: 100, deadline: '2023-11-30' },
                    { name: '區域市場擴張', status: '進行中', progress: 40, deadline: '2024-06-30' }
                ]
            },
            {
                id: 4,
                name: '陳美玲',
                department: '設計部',
                position: 'UI/UX 設計師',
                salary: 55000,
                email: 'meiling.chen@company.com',
                phone: '0945-678-901',
                address: '台中市西屯區台灣大道四段925號',
                joinDate: '2021-09-01',
                skills: ['Figma', 'Adobe XD', 'Sketch', 'User Research', 'Prototyping', 'Design Systems'],
                projects: [
                    { name: '手機 APP 重新設計', status: '進行中', progress: 55, deadline: '2024-04-15' },
                    { name: '網站使用者體驗優化', status: '進行中', progress: 80, deadline: '2024-03-10' },
                    { name: '設計系統建立', status: '已完成', progress: 100, deadline: '2023-10-31' }
                ]
            }
        ];

        let gridApi1, gridApi2, gridApi3;
        let expandedRows = new Set();

        // 方法1: 展開行實現
        function initExpandableGrid() {
            const columnDefs = [
                {
                    headerName: '',
                    field: 'expand',
                    width: 80,
                    cellRenderer: params => {
                        if (params.data.isDetail) return '';
                        
                        const isExpanded = expandedRows.has(params.data.id);
                        const icon = isExpanded ? 'fa-minus' : 'fa-plus';
                        const btnClass = isExpanded ? 'collapse-btn' : 'expand-btn';
                        const text = isExpanded ? '收合' : '展開';
                        
                        return `<button class="${btnClass}" onclick="toggleRowDetail(${params.data.id})">
                                    <i class="fas ${icon}"></i> ${text}
                                </button>`;
                    },
                    suppressMovable: true,
                    suppressMenu: true
                },
                { headerName: 'ID', field: 'id', width: 70, hide: false },
                { headerName: '姓名', field: 'name', width: 120, cellStyle: { fontWeight: 'bold' } },
                { headerName: '部門', field: 'department', width: 100 },
                { headerName: '職位', field: 'position', width: 180 },
                { 
                    headerName: '薪資', 
                    field: 'salary', 
                    width: 100,
                    valueFormatter: params => params.value ? `$${params.value.toLocaleString()}` : '',
                    cellStyle: { color: '#28a745', fontWeight: 'bold' }
                }
            ];

            const gridOptions = {
                columnDefs: columnDefs,
                rowData: generateExpandableData(),
                defaultColDef: {
                    resizable: true,
                    sortable: true,
                    filter: true
                },
                getRowHeight: params => {
                    if (params.data.isDetail) {
                        return 'auto';
                    }
                    return 50;
                },
                onGridReady: params => {
                    gridApi1 = params.api;
                    params.api.sizeColumnsToFit();
                },
                rowStyle: params => {
                    if (params.data.isDetail) {
                        return { border: 'none', background: 'transparent' };
                    }
                    return null;
                }
            };

            const gridDiv = document.querySelector('#grid1');
            new agGrid.Grid(gridDiv, gridOptions);
        }

        // 方法2: 快速檢視
        function initQuickViewGrid() {
            const columnDefs = [
                {
                    headerName: '檢視',
                    field: 'quickView',
                    width: 80,
                    cellRenderer: params => {
                        return `<button class="expand-btn" onclick="showQuickView(${params.data.id})">
                                    <i class="fas fa-eye"></i>
                                </button>`;
                    }
                },
                { headerName: 'ID', field: 'id', width: 70 },
                { headerName: '姓名', field: 'name', width: 120, cellStyle: { fontWeight: 'bold' } },
                { headerName: '部門', field: 'department', width: 120 },
                { headerName: '職位', field: 'position', width: 180 },
                { 
                    headerName: '薪資', 
                    field: 'salary', 
                    width: 120,
                    valueFormatter: params => `$${params.value.toLocaleString()}`,
                    cellStyle: { color: '#28a745', fontWeight: 'bold' }
                }
            ];

            const gridOptions = {
                columnDefs: columnDefs,
                rowData: employeeData,
                defaultColDef: {
                    resizable: true,
                    sortable: true,
                    filter: true
                },
                onGridReady: params => {
                    gridApi2 = params.api;
                    params.api.sizeColumnsToFit();
                }
            };

            const gridDiv = document.querySelector('#grid2');
            new agGrid.Grid(gridDiv, gridOptions);
        }

        // 方法3: 彈出視窗
        function initModalGrid() {
            const columnDefs = [
                {
                    headerName: '詳細',
                    field: 'modal',
                    width: 80,
                    cellRenderer: params => {
                        return `<button class="expand-btn" onclick="showDetailModal(${params.data.id})">
                                    <i class="fas fa-external-link-alt"></i>
                                </button>`;
                    }
                },
                { headerName: 'ID', field: 'id', width: 70 },
                { headerName: '姓名', field: 'name', width: 120, cellStyle: { fontWeight: 'bold' } },
                { headerName: '部門', field: 'department', width: 120 },
                { headerName: '職位', field: 'position', width: 180 },
                { 
                    headerName: '薪資', 
                    field: 'salary', 
                    width: 120,
                    valueFormatter: params => `$${params.value.toLocaleString()}`,
                    cellStyle: { color: '#28a745', fontWeight: 'bold' }
                }
            ];

            const gridOptions = {
                columnDefs: columnDefs,
                rowData: employeeData,
                defaultColDef: {
                    resizable: true,
                    sortable: true,
                    filter: true
                },
                onGridReady: params => {
                    gridApi3 = params.api;
                    params.api.sizeColumnsToFit();
                }
            };

            const gridDiv = document.querySelector('#grid3');
            new agGrid.Grid(gridDiv, gridOptions);
        }

        // 生成可展開的數據
        function generateExpandableData() {
            const expandableData = [];
            employeeData.forEach(item => {
                expandableData.push(item);
                
                if (expandedRows.has(item.id)) {
                    expandableData.push({
                        isDetail: true,
                        originalData: item,
                        id: `detail-${item.id}`,
                        name: createDetailPanel(item),
                        department: '',
                        position: '',
                        salary: null,
                        expand: ''
                    });
                }
            });
            return expandableData;
        }

        // 創建詳細面板
        function createDetailPanel(data) {
            const avatar = data.name.charAt(0);
            
            return `
                <div class="detail-panel">
                    <div class="detail-header">
                        <div class="detail-avatar">${avatar}</div>
                        <div class="detail-title">
                            <h3 class="detail-name">${data.name}</h3>
                            <p class="detail-position">${data.position} - ${data.department}</p>
                        </div>
                    </div>
                    
                    <div class="detail-content">
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <div class="detail-card-icon contact-icon">
                                    <i class="fas fa-address-card"></i>
                                </div>
                                <div class="detail-card-title">聯絡資訊</div>
                            </div>
                            <div class="detail-info">
                                <div><i class="fas fa-envelope"></i> ${data.email}</div>
                                <div><i class="fas fa-phone"></i> ${data.phone}</div>
                                <div><i class="fas fa-map-marker-alt"></i> ${data.address}</div>
                            </div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <div class="detail-card-icon work-icon">
                                    <i class="fas fa-briefcase"></i>
                                </div>
                                <div class="detail-card-title">工作資訊</div>
                            </div>
                            <div class="detail-info">
                                <div><i class="fas fa-calendar-alt"></i> 入職日期: ${data.joinDate}</div>
                                <div><i class="fas fa-dollar-sign"></i> 薪資: $${data.salary.toLocaleString()}</div>
                                <div><i class="fas fa-building"></i> 部門: ${data.department}</div>
                            </div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <div class="detail-card-icon skills-icon">
                                    <i class="fas fa-cogs"></i>
                                </div>
                                <div class="detail-card-title">專業技能</div>
                            </div>
                            <div class="detail-info">
                                ${data.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                            </div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-card-header">
                                <div class="detail-card-icon projects-icon">
                                    <i class="fas fa-tasks"></i>
                                </div>
                                <div class="detail-card-title">專案進度</div>
                            </div>
                            <div class="detail-info">
                                ${data.projects.map(project => `
                                    <div class="project-item">
                                        <div class="project-name">
                                            <i class="fas fa-project-diagram"></i> ${project.name}
                                        </div>
                                        <span class="project-status ${project.status === '已完成' ? 'status-completed' : 'status-progress'}">
                                            ${project.status}
                                        </span>
                                        <div class="progress-bar">
                                            <div class="progress-fill" style="width: ${project.progress}%"></div>
                                        </div>
                                        <small>截止日期: ${project.deadline}</small>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 切換行詳細資訊
        function toggleRowDetail(id) {
            if (expandedRows.has(id)) {
                expandedRows.delete(id);
            } else {
                expandedRows.add(id);
            }
            
            gridApi1.setRowData(generateExpandableData());
            
            // 延遲調整列寬以確保內容正確渲染
            setTimeout(() => {
                gridApi1.sizeColumnsToFit();
            }, 100);
        }

        // 快速檢視
        function showQuickView(id) {
            const data = employeeData.find(item => item.id === id);
            if (data) {
                const summary = `
                    員工: ${data.name}
                    職位: ${data.position}
                    部門: ${data.department}
                    Email: ${data.email}
                    電話: ${data.phone}
                    
                    主要技能: ${data.skills.slice(0, 3).join(', ')}
                    
                    進行中專案: ${data.projects.filter(p => p.status === '進行中').length} 個
                    已完成專案: ${data.projects.filter(p => p.status === '已完成').length} 個
                `;
                alert(summary);
            }
        }

        // 顯示詳細彈出視窗
        function showDetailModal(id) {
            const data = employeeData.find(item => item.id === id);
            if (data) {
                const modalContent = `
                    <div class="modal-content">
                        <h2><i class="fas fa-user-circle"></i> ${data.name} - 詳細資訊</h2>
                        ${createDetailPanel(data)}
                        <div style="text-align: center;">
                            <button class="close-btn" onclick="closeModal()">
                                <i class="fas fa-times"></i> 關閉
                            </button>
                        </div>
                    </div>
                `;
                
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = modalContent;
                modal.onclick = (e) => {
                    if (e.target === modal) closeModal();
                };
                
                document.body.appendChild(modal);
            }
        }

        // 關閉彈出視窗
        function closeModal() {
            const modal = document.querySelector('.modal-overlay');
            if (modal) {
                modal.remove();
            }
        }

        // 方法切換
        function showMethod(methodNumber) {
            // 隱藏所有表格
            document.getElementById('grid1').style.display = 'none';
            document.getElementById('grid2').style.display = 'none';
            document.getElementById('grid3').style.display = 'none';
            
            // 顯示選中的表格
            document.getElementById(`grid${methodNumber}`).style.display = 'block';
            
            // 更新按鈕狀態
            document.querySelectorAll('.tab-btn').forEach((btn, index) => {
                btn.classList.toggle('active', index === methodNumber - 1);
            });
            
            // 調整列寬
            setTimeout(() => {
                if (methodNumber === 1 && gridApi1) gridApi1.sizeColumnsToFit();
                if (methodNumber === 2 && gridApi2) gridApi2.sizeColumnsToFit();
                if (methodNumber === 3 && gridApi3) gridApi3.sizeColumnsToFit();
            }, 100);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initExpandableGrid();
            initQuickViewGrid();
            initModalGrid();
            
            // 鍵盤快捷鍵
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
